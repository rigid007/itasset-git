{% extends "base.html" %}
{% block title %}BIOS 模板 - 带外管理{% endblock %}
{% block content %}
<div class="container-fluid mt-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="fas fa-sliders-h"></i> BIOS 模板批量下发 <small class="text-muted">BIOS Template</small></h4>
    <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('oob.firmware_page') }}"><i class="fas fa-microchip"></i> 固件升级</a>
  </div>

  <div class="row">
    <div class="col-lg-6">
      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between">
          <span><i class="fas fa-server"></i> 控制器属性</span>
          <select id="ctrlSel" class="form-select form-select-sm w-auto d-inline"></select>
        </div>
        <div class="card-body" style="max-height:360px;overflow:auto">
          <div id="attrAlert"></div>
          <table class="table table-sm table-hover" id="attrTable" style="display:none">
            <thead><tr><th>属性</th><th>当前值</th><th>待生效</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="card-footer">
          <button class="btn btn-primary btn-sm" id="btnSave"><i class="fas fa-save"></i> 另存为模板</button>
          <button class="btn btn-outline-secondary btn-sm" id="btnRead"><i class="fas fa-sync"></i> 读取属性</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><i class="fas fa-layer-group"></i> 模板库</div>
        <div class="card-body p-0" style="max-height:300px;overflow:auto">
          <table class="table table-sm mb-0" id="tplTable">
            <thead><tr><th>名称</th><th>厂商</th><th>属性数</th><th>操作</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="card">
        <div class="card-header d-flex justify-content-between">
          <span><i class="fas fa-paper-plane"></i> 批量下发</span>
          <button class="btn btn-success btn-sm" id="btnApply"><i class="fas fa-share-square"></i> 下发到所选</button>
        </div>
        <div class="card-body" style="max-height:660px;overflow:auto">
          <div class="form-text text-muted mb-2">勾选目标控制器，再从左侧模板库「下发」。</div>
          <table class="table table-sm table-hover" id="targetTable">
            <thead><tr><th></th><th>名称</th><th>BMC IP</th><th>厂商</th><th>凭据</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="applyModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h6 class="modal-title">下发结果</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="applyBody"></div>
    </div>
  </div>
</div>

<script>
const $ = sel => document.querySelector(sel);
const api = (u, opt={}) => {
  const hd = {'Content-Type':'application/json'};
  const tk = document.querySelector('meta[name="csrf-token"]');
  if (tk) hd['X-CSRFToken'] = tk.content;
  return fetch(u, Object.assign({headers: hd}, opt)).then(r=>r.json().catch(()=>({})));
};
let controllers=[], currentCid=null, currentAttrs={};
const targetSel = new Set();

function loadControllers(){
  api('{{ url_for("oob.firmware_controllers") }}').then(list=>{
    controllers=list;
    const sel=$('#ctrlSel'); sel.innerHTML='<option value="">— 选择控制器 —</option>';
    list.forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.textContent=`${c.name} (${c.bmc_ip||''})`; sel.appendChild(o);});
    const tb=$('#targetTable tbody'); tb.innerHTML='';
    list.forEach(c=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`<td><input type="checkbox" class="form-check-input" data-id="${c.id}"></td>
        <td>${c.name||''}</td><td>${c.bmc_ip||''}</td><td>${c.vendor||''}</td>
        <td>${c.has_credential?'<span class="badge bg-success">有</span>':'<span class="badge bg-secondary">无</span>'}</td>`;
      tr.querySelector('input').onchange=e=>{ if(e.target.checked) targetSel.add(c.id); else targetSel.delete(c.id); };
      tb.appendChild(tr);
    });
  });
  loadTemplates();
}
$('#ctrlSel').onchange = e=>{ currentCid=e.target.value?+e.target.value:null; if(currentCid) readAttrs(); };
function readAttrs(){
  $('#attrAlert').innerHTML='<div class="text-info small">读取中…</div>';
  api(`/oob/api/bios/${currentCid}/attributes`).then(d=>{
    if(d.error){ $('#attrAlert').innerHTML=`<div class="alert alert-warning py-1">${d.error}</div>`; return; }
    $('#attrAlert').html='';
    currentAttrs=d.attributes||{};
    const tb=$('#attrTable tbody'); tb.innerHTML='';
    const pend=d.pending||{};
    Object.entries(currentAttrs).forEach(([k,v])=>{
      const tr=document.createElement('tr');
      const p = (k in pend && pend[k]!==v)?`<span class="badge bg-warning">${pend[k]}</span>`:'';
      tr.innerHTML=`<td><code>${k}</code></td><td>${v}</td><td>${p}</td>`;
      tb.appendChild(tr);
    });
    $('#attrTable').style.display='table';
  });
}
$('#btnRead').onclick = ()=>{ if(currentCid) readAttrs(); else alert('请先选择控制器'); };
$('#btnSave').onclick = ()=>{
  if(!currentCid){ alert('请先选择并读取一台控制器的属性'); return; }
  const name=prompt('模板名称：'); if(!name) return;
  api('{{ url_for("oob.bios_template_create") }}',{method:'POST',
      body:JSON.stringify({name, attributes:currentAttrs, source_controller_id:currentCid})})
    .then(d=>{ if(d.error) alert(d.error); else { alert('已保存模板'); loadTemplates(); }});
};
function loadTemplates(){
  api('{{ url_for("oob.bios_template_list") }}').then(list=>{
    const tb=$('#tplTable tbody'); tb.innerHTML='';
    list.forEach(t=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${t.name}</td><td>${t.vendor||''}</td><td>${t.attribute_count}</td>
        <td>
          <button class="btn btn-sm btn-outline-info" data-act="view" data-id="${t.id}">查看</button>
          <button class="btn btn-sm btn-outline-success" data-act="apply" data-id="${t.id}">下发</button>
          <button class="btn btn-sm btn-outline-danger" data-act="del" data-id="${t.id}">删</button>
        </td>`;
      tr.querySelectorAll('button').forEach(b=>b.onclick=()=>tplAct(b.dataset.act,+b.dataset.id));
      tb.appendChild(tr);
    });
  });
}
function tplAct(act,id){
  if(act==='del'){ if(!confirm('确认删除该模板？')) return;
    api(`/oob/api/bios/templates/${id}`,{method:'DELETE'}).then(()=>loadTemplates()); return; }
  if(act==='view'){
    api(`/oob/api/bios/templates/${id}`).then(d=>{
      let html='<ul class="list-unstyled mb-0">';
      Object.entries(d.attributes||{}).forEach(([k,v])=>html+=`<li><code>${k}</code> = ${v}</li>`);
      html+='</ul>';
      $('#applyBody').innerHTML=`<h6>${d.name}</h6>${html}`;
      new bootstrap.Modal($('#applyModal')).show();
    }); return;
  }
  if(act==='apply'){
    if(targetSel.size===0){ alert('请勾选右侧目标控制器'); return; }
    if(!confirm(`确认将模板下发到 ${targetSel.size} 台控制器？设备需重启才能生效。`)) return;
    api(`/oob/api/bios/templates/${id}/apply`,{method:'POST',body:JSON.stringify({controller_ids:[...targetSel]})})
      .then(d=>{
        let html=`<h6>模板：${d.template}</h6><table class="table table-sm"><thead><tr><th>控制器</th><th>结果</th></tr></thead><tbody>`;
        (d.results||[]).forEach(r=>html+=`<tr><td>${r.name||r.controller_id}</td><td><span class="badge ${r.status==='success'?'bg-success':r.status==='failed'?'bg-danger':'bg-secondary'}">${r.status}</span> ${r.message||''}</td></tr>`);
        html+='</tbody></table>';
        $('#applyBody').innerHTML=html;
        new bootstrap.Modal($('#applyModal')).show();
      });
  }
}
loadControllers();
</script>
{% endblock %}
