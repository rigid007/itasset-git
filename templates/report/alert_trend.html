{% extends "base.html" %}

{% block title %}告警趋势报表 - 数据中心管理系统{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-0">告警趋势报表</h1>
            <p class="text-muted">展示告警数量随时间的变化趋势</p>
        </div>
        <div>
            <a href="{{ url_for('report.report_dashboard') }}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left"></i> 返回报表中心
            </a>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">告警趋势概览</h6>
        </div>
        <div class="card-body">
            <div class="alert alert-info mb-0">
                <i class="fas fa-info-circle"></i>
                本报表聚合近 30 天告警数据，按天统计告警产生数量。可在
                <a href="{{ url_for('report.alert_statistics_report') }}">告警统计报表</a>
                查看按严重级别与设备的详细分布。
            </div>
            <div class="text-center text-muted mt-4">
                <i class="fas fa-chart-area fa-3x mb-3"></i>
                <p>趋势图加载中（基于 report/alert_statistics 同源数据）</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
