<!-- snmp_config.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SNMP配置 - 拓扑管理系统</title>
    <!-- 引入Bootstrap和Font Awesome -->
</head>
<body>
    <div class="container-fluid mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4><i class="fas fa-cogs me-2"></i>SNMP配置管理</h4>
            </div>
            <div class="card-body">
                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">设备SNMP设置</div>
                            <div class="card-body">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>设备名称</th>
                                            <th>IP地址</th>
                                            <th>SNMP版本</th>
                                            <th>Community</th>
                                            <th>状态</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="snmpConfigTable">
                                        <!-- 通过JS动态加载 -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">SNMP测试</div>
                            <div class="card-body">
                                <form id="snmpTestForm">
                                    <div class="mb-3">
                                        <label class="form-label">目标IP地址</label>
                                        <input type="text" class="form-control" id="targetIp" placeholder="192.168.1.1">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">SNMP Community</label>
                                        <input type="text" class="form-control" id="testCommunity" value="public">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">SNMP版本</label>
                                        <select id="testVersion" class="form-select">
                                            <option value="2c">v2c</option>
                                            <option value="1">v1</option>
                                        </select>
                                    </div>
                                    <button type="button" class="btn btn-primary w-100" id="testConnectionBtn">
                                        <i class="fas fa-plug me-2"></i>测试连接
                                    </button>
                                </form>
                                <div id="testResult" class="mt-3"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">SNMP发现日志</div>
                    <div class="card-body">
                        <div id="snmpLogs" style="max-height: 300px; overflow-y: auto;">
                            <div class="text-center text-muted py-3">暂无日志</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 加载设备SNMP配置
        function loadSnmpConfig() {
            $.get(`${API_BASE}/api/devices/snmp_config`, function(data) {
                if (data.success) {
                    let html = '';
                    data.devices.forEach(device => {
                        const status = device.snmp_enabled ? 
                            '<span class="badge bg-success">已启用</span>' : 
                            '<span class="badge bg-secondary">未启用</span>';
                        
                        html += `
                            <tr>
                                <td>${device.name}</td>
                                <td>${device.ip_address}</td>
                                <td>${device.snmp_version || 'v2c'}</td>
                                <td>${device.snmp_community || 'public'}</td>
                                <td>${status}</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary test-device-btn" 
                                            data-device-id="${device.id}">
                                        <i class="fas fa-test"></i> 测试
                                    </button>
                                    <button class="btn btn-sm btn-outline-warning edit-snmp-btn" 
                                            data-device-id="${device.id}">
                                        <i class="fas fa-edit"></i> 编辑
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                    $('#snmpConfigTable').html(html);
                }
            });
        }
        
        // 页面加载时初始化
        $(document).ready(function() {
            loadSnmpConfig();
            
            // 测试连接按钮
            $('#testConnectionBtn').click(function() {
                const targetIp = $('#targetIp').val();
                const community = $('#testCommunity').val();
                const version = $('#testVersion').val();
                
                if (!targetIp) {
                    alert('请输入目标IP地址');
                    return;
                }
                
                $('#testResult').html(`
                    <div class="alert alert-info">
                        <i class="fas fa-spinner fa-spin me-2"></i>
                        正在测试SNMP连接...
                    </div>
                `);
                
                // 发送测试请求
                $.ajax({
                    url: `${API_BASE}/api/snmp/test_connection`,
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        target_ip: targetIp,
                        community: community,
                        version: version
                    }),
                    success: function(response) {
                        if (response.success) {
                            $('#testResult').html(`
                                <div class="alert alert-success">
                                    <i class="fas fa-check-circle me-2"></i>
                                    <strong>连接成功！</strong><br>
                                    ${response.message}<br>
                                    ${response.system_info ? `系统信息: ${response.system_info}` : ''}
                                </div>
                            `);
                            
                            // 添加到日志
                            addSnmpLog(`成功连接到 ${targetIp}`, 'success');
                        } else {
                            $('#testResult').html(`
                                <div class="alert alert-danger">
                                    <i class="fas fa-times-circle me-2"></i>
                                    <strong>连接失败！</strong><br>
                                    ${response.message}
                                </div>
                            `);
                            
                            addSnmpLog(`无法连接到 ${targetIp}: ${response.message}`, 'error');
                        }
                    },
                    error: function(xhr, status, error) {
                        $('#testResult').html(`
                            <div class="alert alert-danger">
                                <i class="fas fa-times-circle me-2"></i>
                                <strong>请求失败！</strong><br>
                                ${error}
                            </div>
                        `);
                    }
                });
            });
        });
        
        function addSnmpLog(message, type = 'info') {
            const now = new Date().toLocaleTimeString();
            const logEntry = `
                <div class="border-bottom pb-2 mb-2">
                    <small class="text-muted">[${now}]</small>
                    <span class="ms-2 ${type === 'success' ? 'text-success' : type === 'error' ? 'text-danger' : 'text-info'}">
                        ${message}
                    </span>
                </div>
            `;
            
            $('#snmpLogs').prepend(logEntry);
        }
    </script>
</body>
</html>
