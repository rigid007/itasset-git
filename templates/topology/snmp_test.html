<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNMP测试 - 拓扑管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .test-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            background-color: #fff;
        }
        .result-card {
            margin-top: 2rem;
            padding: 1.5rem;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            background-color: #f8f9fa;
        }
        .interface-item {
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            background-color: #fff;
        }
        .status-up {
            color: #28a745;
        }
        .status-down {
            color: #dc3545;
        }
        .progress-container {
            height: 20px;
            background-color: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        .progress-bar {
            height: 100%;
            background-color: #007bff;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container-fluid mt-4">
        <div class="test-container">
            <h1 class="mb-4"><i class="fas fa-satellite-dish text-primary me-2"></i>SNMP发现测试</h1>
            
            <div class="mb-4">
                <h4>1. 选择设备</h4>
                <select id="testDevice" class="form-select">
                    <option value="">请选择设备</option>
                    {% for device in devices %}
                    <option value="{{ device.id }}" data-ip="{{ device.management_ip or device.ip_address }}" data-community="{{ device.snmp_community or 'public' }}">
                        {{ device.name }} 
                        {% if device.management_ip or device.ip_address %}
                            ({{ device.management_ip or device.ip_address }})
                        {% endif %}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-4">
                <h4>2. SNMP配置</h4>
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label">SNMP Community</label>
                        <input type="text" class="form-control" id="snmpCommunity" value="public">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">SNMP版本</label>
                        <select id="snmpVersion" class="form-select">
                            <option value="2c">SNMP v2c</option>
                            <option value="1">SNMP v1</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">SNMP端口</label>
                        <input type="number" class="form-control" id="snmpPort" value="161">
                    </div>
                </div>
            </div>
            
            <div class="mb-4">
                <h4>3. 选项</h4>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="autoSave" checked>
                    <label class="form-check-label" for="autoSave">
                        自动保存发现的接口
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="includeDetails" checked>
                    <label class="form-check-label" for="includeDetails">
                        包含详细接口信息
                    </label>
                </div>
            </div>
            
            <div class="mb-4">
                <h4>4. 测试</h4>
                <button class="btn btn-primary btn-lg" id="startTestBtn">
                    <i class="fas fa-play me-2"></i>开始SNMP发现测试
                </button>
                <button class="btn btn-outline-secondary ms-2" id="directTestBtn">
                    <i class="fas fa-bolt me-2"></i>直接测试API
                </button>
            </div>
            
            <div id="progressSection" class="d-none">
                <h5>发现进度</h5>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                </div>
                <div id="progressText" class="text-center">准备开始...</div>
            </div>
            
            <div id="resultSection" class="d-none">
                <h5>测试结果</h5>
                <div class="result-card">
                    <div id="resultContent"></div>
                </div>
            </div>
            
            <div class="mt-4">
                <a href="{{ url_for('topology.interface_view') }}" class="btn btn-outline-primary">
                    <i class="fas fa-arrow-left me-2"></i>返回接口视图
                </a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/topology';
        
        // 设备选择时自动填充信息
        $('#testDevice').change(function() {
            const selected = $(this).find(':selected');
            const community = selected.data('community');
            const ip = selected.data('ip');
            
            if (community) {
                $('#snmpCommunity').val(community);
            }
            
            if (ip) {
                $(this).next('.form-text').remove();
                $(this).after(`<div class="form-text">设备IP: ${ip}</div>`);
            }
        });
        
        // 开始测试按钮
        $('#startTestBtn').click(function() {
            const deviceId = $('#testDevice').val();
            const community = $('#snmpCommunity').val();
            const version = $('#snmpVersion').val();
            const port = $('#snmpPort').val();
            const autoSave = $('#autoSave').is(':checked');
            const includeDetails = $('#includeDetails').is(':checked');
            
            if (!deviceId) {
                alert('请选择设备');
                return;
            }
            
            if (!community) {
                alert('请输入SNMP Community');
                return;
            }
            
            // 显示进度条
            $('#progressSection').removeClass('d-none');
            $('#resultSection').addClass('d-none');
            
            // 重置进度条
            updateProgress(0, '正在准备SNMP发现...');
            
            // 准备请求数据
            const requestData = {
                device_id: parseInt(deviceId),
                snmp_community: community,
                snmp_version: version,
                snmp_port: parseInt(port),
                auto_save: autoSave,
                include_details: includeDetails
            };
            
            console.log('发送SNMP发现请求:', requestData);
            
            // 模拟进度更新
            simulateProgress();
            
            // 发送请求
            $.ajax({
                url: `${API_BASE}/api/interfaces/snmp_discover`,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(requestData),
                dataType: 'json',
                success: function(response) {
                    console.log('SNMP发现响应:', response);
                    
                    if (response.success) {
                        updateProgress(100, '发现完成！');
                        showResults(response);
                    } else {
                        updateProgress(0, '发现失败');
                        showError(response.message || 'SNMP发现失败');
                    }
                },
                error: function(xhr, status, error) {
                    console.error('SNMP发现请求失败:', error);
                    updateProgress(0, '请求失败');
                    showError(`请求失败: ${error}`);
                }
            });
        });
        





// 修改直接测试API函数，添加更详细的调试信息
$('#directTestBtn').click(function() {
    const deviceId = $('#testDevice').val();
    const community = $('#snmpCommunity').val();
    
    if (!deviceId) {
        alert('请选择设备');
        return;
    }
    
    // 准备测试数据 - 使用实际SNMP参数
    const testData = {
        device_id: parseInt(deviceId),
        snmp_community: community || 'public',
        snmp_version: '2c',
        snmp_port: 161,
        auto_save: false,
        include_details: true
    };
    
    console.log('直接测试API:', testData);
    
    // 显示加载
    $('#progressSection').removeClass('d-none');
    $('#resultSection').addClass('d-none');
    updateProgress(50, '正在连接到实际设备...');
    
    // 显示调试信息
    $('#debugInfo').removeClass('d-none');
    $('#debugInfo').html(`
        <div class="alert alert-info">
            <i class="fas fa-info-circle me-2"></i>
            <strong>调试信息：</strong><br>
            目标设备: ${$('#testDevice option:selected').text()}<br>
            SNMP Community: ${community}<br>
            请求数据: ${JSON.stringify(testData, null, 2)}
        </div>
    `);
    
    // 发送测试请求
    $.ajax({
        url: `${API_BASE}/api/interfaces/snmp_discover`,
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(testData),
        dataType: 'json',
        success: function(response) {
            console.log('API测试响应:', response);
            
            if (response.success) {
                updateProgress(100, 'API测试成功！');
                showResults(response, true);
                
                // 显示是否为模拟数据
                if (response.interfaces && response.interfaces.length > 0) {
                    const firstIf = response.interfaces[0];
                    if (firstIf.name && firstIf.name.includes('GigabitEthernet0/')) {
                        $('#debugInfo').append(`
                            <div class="alert alert-warning mt-2">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                <strong>注意：</strong>当前返回的是模拟数据。<br>
                                请确保：<br>
                                1. 设备已开启SNMP服务<br>
                                2. SNMP Community正确<br>
                                3. 防火墙允许UDP 161端口访问
                            </div>
                        `);
                    }
                }
            } else {
                updateProgress(0, 'API测试失败');
                showError(response.message || 'API测试失败');
            }
        },
        error: function(xhr, status, error) {
            console.error('API测试请求失败:', error);
            updateProgress(0, 'API测试失败');
            
            let errorMessage = `请求失败: ${error}`;
            if (xhr.status === 405) {
                errorMessage = '错误：请使用POST方法访问此API，而不是GET方法';
            } else if (xhr.responseText) {
                try {
                    const errorResponse = JSON.parse(xhr.responseText);
                    if (errorResponse.message) {
                        errorMessage = errorResponse.message;
                    }
                } catch (e) {
                    errorMessage = `服务器错误: ${xhr.status} ${xhr.statusText}`;
                }
            }
            
            showError(errorMessage);
        }
    });
});
        
        // 模拟进度更新
        function simulateProgress() {
            let progress = 0;
            const interval = setInterval(() => {
                if (progress >= 90) {
                    clearInterval(interval);
                    return;
                }
                
                progress += 10;
                updateProgress(progress, `正在发现接口... ${progress}%`);
            }, 500);
        }
        
        // 更新进度条
        function updateProgress(percent, text) {
            $('#progressBar').css('width', `${percent}%`);
            $('#progressText').text(text);
        }
        
        // 显示结果
        function showResults(response, isTest = false) {
            $('#resultSection').removeClass('d-none');
            
            let html = `
                <div class="alert alert-success">
                    <i class="fas fa-check-circle me-2"></i>
                    <strong>${isTest ? 'API测试成功' : 'SNMP发现成功'}！</strong><br>
                    ${response.message}
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h6 class="card-title">设备信息</h6>
                                <p class="mb-1"><strong>设备名称:</strong> ${response.device_name}</p>
                                <p class="mb-1"><strong>目标IP:</strong> ${response.target_ip}</p>
                                <p class="mb-1"><strong>发现接口数:</strong> ${response.discovered_count}</p>
                                <p class="mb-1"><strong>保存接口数:</strong> ${response.saved_count}</p>
                                <p class="mb-0"><strong>自动保存:</strong> 
                                    <span class="badge ${response.auto_saved ? 'bg-success' : 'bg-secondary'}">
                                        ${response.auto_saved ? '已启用' : '未启用'}
                                    </span>
                                </p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h6 class="card-title">发现统计</h6>
                                <p class="mb-1"><strong>总接口数:</strong> ${response.discovered_count}</p>
                                <p class="mb-1"><strong>UP接口:</strong> 
                                    ${response.interfaces ? response.interfaces.filter(i => i.admin_status === 'up').length : 0}
                                </p>
                                <p class="mb-1"><strong>DOWN接口:</strong> 
                                    ${response.interfaces ? response.interfaces.filter(i => i.admin_status === 'down').length : 0}
                                </p>
                                <p class="mb-0"><strong>测试时间:</strong> ${new Date().toLocaleString()}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // 显示接口列表
            if (response.interfaces && response.interfaces.length > 0) {
                html += `
                    <h6>发现的接口 (前${Math.min(response.interfaces.length, 10)}个):</h6>
                    <div class="table-responsive">
                        <table class="table table-sm table-hover">
                            <thead>
                                <tr>
                                    <th>接口名称</th>
                                    <th>描述</th>
                                    <th>状态</th>
                                    <th>速率</th>
                                    <th>VLAN</th>
                                    <th>IP地址</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                response.interfaces.slice(0, 10).forEach(iface => {
                    const speedMbps = iface.speed ? (iface.speed / 1000000).toFixed(0) : 'N/A';
                    const speedDisplay = speedMbps >= 1000 ? 
                        `${(speedMbps / 1000).toFixed(1)}G` : `${speedMbps}M`;
                    
                    html += `
                        <tr>
                            <td><code>${iface.name}</code></td>
                            <td>${iface.description || '-'}</td>
                            <td>
                                <span class="badge ${iface.admin_status === 'up' ? 'bg-success' : 'bg-danger'}">
                                    <i class="fas fa-circle ${iface.admin_status === 'up' ? 'status-up' : 'status-down'} me-1"></i>
                                    ${iface.admin_status}
                                </span>
                            </td>
                            <td>${speedDisplay}</td>
                            <td>${iface.vlan || '-'}</td>
                            <td>${iface.ip_address || '-'}</td>
                        </tr>
                    `;
                });
                
                html += `
                            </tbody>
                        </table>
                    </div>
                `;
                
                if (response.interfaces.length > 10) {
                    html += `<p class="text-muted">... 还有 ${response.interfaces.length - 10} 个接口未显示</p>`;
                }
            } else {
                html += `<div class="alert alert-info">未发现任何接口</div>`;
            }
            
            // 显示保存的接口
            if (response.auto_saved && response.saved_interfaces && response.saved_interfaces.length > 0) {
                html += `
                    <h6 class="mt-3">已保存的接口:</h6>
                    <div class="border rounded p-2 bg-light">
                        ${response.saved_interfaces.map(name => 
                            `<span class="badge bg-success me-1 mb-1">${name}</span>`
                        ).join('')}
                    </div>
                `;
            }
            
            $('#resultContent').html(html);
            
            // 如果自动保存了接口，提示刷新页面
            if (response.auto_saved && response.saved_count > 0) {
                setTimeout(() => {
                    alert(`已成功保存 ${response.saved_count} 个接口。点击确定后页面将刷新以显示新接口。`);
                    window.location.href = `${API_BASE}/interface/view`;
                }, 1000);
            }
        }
        
        // 显示错误
        function showError(message) {
            $('#resultSection').removeClass('d-none');
            $('#resultContent').html(`
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <strong>错误！</strong><br>
                    ${message}
                </div>
                <div class="mt-3">
                    <h6>调试建议:</h6>
                    <ol>
                        <li>检查设备IP地址是否正确</li>
                        <li>确认SNMP Community字符串是否正确</li>
                        <li>确保设备开启了SNMP服务</li>
                        <li>检查防火墙是否允许SNMP流量（UDP 161端口）</li>
                        <li>尝试使用不同的SNMP版本</li>
                    </ol>
                </div>
            `);
        }




    </script>
</body>
</html>
