{% extends "base.html" %}

{% block title %}页面未找到 - 网络资产管理系统{% endblock %}

{% block page_title %}<i class="fas fa-exclamation-triangle text-danger"></i> 404 页面未找到{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-lg-8">
        <div class="card border-danger">
            <div class="card-body text-center">
                <h1 class="display-4">404</h1>
                <h3 class="card-title mb-4">抱歉，你访问的页面不存在</h3>
                <p class="text-muted mb-4">
                    可能是网址输入错误、页面已删除，或你暂无访问权限
                </p>
                <a href="{{ url_for('location.location_list') }}" class="btn btn-primary">
                    <i class="fas fa-arrow-left"></i> 返回位置列表
                </a>
                <a href="{{ url_for('main.index') }}" class="btn btn-secondary ms-2">
                    <i class="fas fa-home"></i> 返回首页
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
