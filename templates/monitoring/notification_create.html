{# templates/monitoring/notification_create.html #}
{% extends "base.html" %}

{% block title %}新建通知配置 - 监控系统{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="bi bi-plus-circle me-2"></i>新建通知配置</h5>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('monitoring.notification_create') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <!-- 基本信息 -->
                        <div class="mb-3">
                            <label for="name" class="form-label">名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">描述</label>
                            <textarea class="form-control" id="description" name="description" rows="2"></textarea>
                        </div>
                        
                        <!-- 通知类型 -->
                        <div class="mb-3">
                            <label for="notification_type" class="form-label">通知类型 <span class="text-danger">*</span></label>
                            <select class="form-select" id="notification_type" name="notification_type" required>
                                <option value="">请选择</option>
                                <option value="email">邮件 (Email)</option>
                                <option value="sms">短信 (SMS)</option>
                                <option value="webhook">Webhook</option>
                                <option value="slack">Slack</option>
                                <option value="wechat">企业微信</option>
                            </select>
                        </div>
                        
                        <!-- 接收者列表 -->
                        <div class="mb-3">
                            <label for="receivers" class="form-label">接收者</label>
                            <textarea class="form-control" id="receivers" name="receivers" rows="3" 
                                      placeholder="每行一个接收者（邮箱、手机号、Webhook URL等）"></textarea>
                            <div class="form-text">根据通知类型填写对应的接收地址，每行一个。</div>
                        </div>
                        
                        <!-- 触发条件 -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="trigger_on" class="form-label">触发级别</label>
                                <select class="form-select" id="trigger_on" name="trigger_on">
                                    <option value="all">所有级别</option>
                                    <option value="critical">严重</option>
                                    <option value="error">错误</option>
                                    <option value="warning">警告</option>
                                    <option value="info">信息</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="trigger_delay" class="form-label">触发延迟（秒）</label>
                                <input type="number" class="form-control" id="trigger_delay" name="trigger_delay" value="0" min="0">
                            </div>
                        </div>
                        
                        <!-- 最大通知次数 -->
                        <div class="mb-3">
                            <label for="max_notifications" class="form-label">最大通知次数（0表示无限制）</label>
                            <input type="number" class="form-control" id="max_notifications" name="max_notifications" value="10" min="0">
                        </div>
                        
                        <!-- 模板 - 修复 placeholder 中的变量示例 -->
                        <div class="mb-3">
                            <label for="title_template" class="form-label">标题模板</label>
                            <input type="text" class="form-control" id="title_template" name="title_template" 
                                   placeholder="如：【监控告警】{{ '{{' }} alert.name {{ '}}' }}">
                        </div>
                        <div class="mb-3">
                            <label for="message_template" class="form-label">内容模板</label>
                            <textarea class="form-control" id="message_template" name="message_template" rows="4" 
                                      placeholder="支持变量，如：{{ '{{' }} alert.description {{ '}}' }}"></textarea>
                        </div>
                        
                        <!-- 特定类型配置（JSON） -->
                        <div class="mb-3">
                            <label for="config" class="form-label">特定配置 (JSON)</label>
                            <textarea class="form-control" id="config" name="config" rows="3" 
                                      placeholder='{"api_key": "xxx", "channel": "#general"}'></textarea>
                            <div class="form-text">根据通知类型填写额外配置，如 Webhook 的 headers、Slack 的频道等。</div>
                        </div>
                        
                        <!-- 启用状态 -->
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="enabled" name="enabled" checked>
                            <label class="form-check-label" for="enabled">
                                立即启用
                            </label>
                        </div>
                        
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('monitoring.notification_list') }}" class="btn btn-secondary">取消</a>
                            <button type="submit" class="btn btn-primary">保存</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
