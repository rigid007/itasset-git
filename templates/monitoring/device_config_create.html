{# templates/monitoring/device_config_create.html #}
{% extends "base.html" %}

{% block title %}新增设备监控配置{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">选择设备</h5>
                </div>
                <div class="card-body">
                    {% if devices %}
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="device_id" class="form-label">设备</label>
                            <select class="form-select" id="device_id" name="device_id" required>
                                <option value="">-- 请选择设备 --</option>
                                {% for dev in devices %}
                                <option value="{{ dev.id }}">{{ dev.name }} ({{ dev.management_ip or dev.ip_address or '无IP' }}) - {{ dev.device_type or '未分类' }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('monitoring.device_config_list') }}" class="btn btn-secondary">取消</a>
                            <button type="submit" class="btn btn-primary">下一步：配置监控参数</button>
                        </div>
                    </form>
                    {% else %}
                    <div class="text-center py-4">
                        <p class="text-muted">所有设备都已配置监控，或暂无设备。</p>
                        <a href="{{ url_for('device.device_list') }}" class="btn btn-primary">前往设备管理</a>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
